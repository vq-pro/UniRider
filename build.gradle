// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlinVersion = "2.1.0"
    ext.agpVersion = "8.5.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// FIXME-2 Passer à KSP au lieu de KAPT
//plugins {
//    id("com.google.devtools.ksp") version "2.3.4" apply false
//}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

ext {
    androidMaterialVersion = "1.13.0"
    androidxAnnotationVersion = "1.9.1"
    androidxNavigationVersion = "2.9.7"
    coreVersion = "1.7.0"
    cucumberVersion = "4.1.1"
    cucumberPicoVersion = "4.1.1"
    espressoVersion = "3.7.0"
    extJUnitVersion = "1.3.0"
    jacksonVersion = "2.21.0"
    jacksonAnnotationVersion = "2.21"
    junitVersion = "4.13.2"
    mockitoInlineVersion = "5.1.1"
    mockitoKotlinVersion = "4.1.0"
    okhttpVersion = "5.1.0"
    retrofitVersion = "3.0.0"
    roomVersion = "2.8.4"
    rulesVersion = "1.7.0"
    runnerVersion = "1.6.1"
    supportAnnotationsVersion = "28.0.0"
}

